<!doctype html>
<html><head><meta charset="utf-8">
<style>@font-face{font-family:"Inter Tight";src:url(../../public/fonts/inter-tight.woff2) format("woff2");font-weight:100 900}@font-face{font-family:"JetBrains Mono";src:url(../../public/fonts/jetbrains-mono.woff2) format("woff2");font-weight:100 800}</style>
<style>
*{box-sizing:border-box;margin:0}
body{background:#000;font-family:"Inter Tight",Arial,sans-serif;color:#fbeff5}
#live{width:1600px;height:900px;position:relative;overflow:hidden;background:#0c070b}
.au{position:absolute;border-radius:50%;filter:blur(110px)}
.a1{width:1000px;height:1000px;right:-260px;top:-520px;background:#f472b6;opacity:.34}
.a2{width:800px;height:800px;left:-360px;bottom:-520px;background:#fbbf24;opacity:.2}
.a3{width:700px;height:700px;right:420px;bottom:-560px;background:#a855f7;opacity:.18}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(1000px 600px at 50% 50%,#000,transparent)}
.rings{position:absolute;right:120px;top:50%;width:560px;height:560px;margin-top:-280px}
.rings i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(244,114,182,.22)}
.rings i:nth-child(2){inset:70px;border-color:rgba(251,191,36,.2)}.rings i:nth-child(3){inset:140px;border-color:rgba(244,114,182,.3)}
.mark{position:absolute;right:250px;top:50%;width:300px;height:300px;margin-top:-150px;border-radius:80px;overflow:hidden;box-shadow:0 50px 140px -30px rgba(244,114,182,.9)}
.mark img{width:100%;height:100%;display:block}
.trail{position:absolute;right:430px;top:560px;width:420px;height:8px;border-radius:8px;background:linear-gradient(90deg,transparent,rgba(244,114,182,.9));transform:rotate(-22deg);transform-origin:right}
.copy{position:absolute;left:110px;top:150px;width:860px}
.pill{display:inline-flex;align-items:center;gap:12px;font:600 20px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#34d399;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.08);border-radius:99px;padding:10px 20px}
.pill i{width:12px;height:12px;border-radius:50%;background:#34d399;box-shadow:0 0 0 6px rgba(52,211,153,.2)}
.tick{font:800 210px/.9 "Inter Tight",Arial,sans-serif;letter-spacing:-.06em;margin:34px 0 0}
.grad{background:linear-gradient(100deg,#f472b6,#fb923c 55%,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.is{font:800 120px/1 "Inter Tight",Arial,sans-serif;letter-spacing:-.05em;margin-top:6px}
.sub{font-size:32px;color:#cdb7c3;margin-top:30px;line-height:1.35}
.foot{position:absolute;left:110px;bottom:70px;right:110px;display:flex;align-items:center;gap:18px;font:700 26px "Inter Tight",Arial,sans-serif}
.url{color:#1f0716;background:linear-gradient(100deg,#f472b6,#fb923c 55%,#fbbf24);padding:14px 28px;border-radius:99px;box-shadow:0 18px 50px -14px rgba(244,114,182,.9)}
.h{color:#cdb7c3;border:1px solid rgba(255,255,255,.16);padding:13px 24px;border-radius:99px}
.sol{background:linear-gradient(90deg,#b57bff,#14f195);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.solg{background:linear-gradient(100deg,#b57bff,#14f195);-webkit-background-clip:text;background-clip:text;color:transparent}
.a4{width:760px;height:760px;right:60px;bottom:-560px;background:#9945ff;opacity:.34}
.a5{width:520px;height:520px;right:520px;top:-380px;background:#14f195;opacity:.12}
.rings i:nth-child(2){border-color:rgba(20,241,149,.25)!important}
.chain{margin-left:auto;font:600 20px "JetBrains Mono";color:#95808c;letter-spacing:.06em}
</style></head><body>
<div id="live">
  <div class="au a1"></div><div class="au a2"></div><div class="au a3"></div><div class="au a4"></div><div class="au a5"></div><div class="grid"></div>
  <div class="rings"><i></i><i></i><i></i></div><div class="trail"></div>
  <div class="mark"><img src="../../public/img/glidy.svg" alt=""></div>
  <div class="copy">
    <span class="pill"><i></i>Now live on <b class="sol">Solana</b></span>
    <div class="tick"><span class="grad">$GLIDY</span></div>
    <div class="is">is live on <span class="solg">Solana.</span></div>
    <div class="sub">The token of the LP agent for Solana.<br>Best Orca pools. Every deposit simulated.</div>
  </div>
  <div class="foot"><span class="url">useglidy.xyz</span><span class="h">@glidyagent</span><span class="chain"><b class="sol">SOLANA</b> · ORCA WHIRLPOOLS · JUPITER</span></div>
</div>
</body></html>
